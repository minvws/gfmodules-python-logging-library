[project]
name = "gfmodules-python-logging-library"
version = "0.1.0"
description = "Provides logging utilities for GFModules Python projects."
license = "EUPL-1.2"
authors = [{ name = "Ministerie van Volksgezondheid, Welzijn en Sport" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
]

[project.optional-dependencies]
# Only the request-context middleware and the exception primitives need a web
# framework, and starlette is all they need, as FastAPI re-exports its Request.
fastapi = ["starlette (>=1.3,<2.0)"]

[project.urls]
repository = "https://github.com/minvws/gfmodules-python-logging-library"

[tool.poetry]
packages = [
    { include = "gfmodules" },
]

[tool.poetry.group.dev.dependencies]
mypy = ">=1.19.1,<3.0.0"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"
pytest-asyncio = "^1.3.0"
ruff = ">=0.16.5,<0.17.0"
codespell = "^2.2.6"
pip-audit = "^2.10.0"
# Required by starlette's TestClient, which the end-to-end tests drive.
httpx2 = "^2.5.0"
# Not a runtime dependency: the library needs starlette only. FastAPI is here
# because per-route access event ids depend on scope["route"], which FastAPI's
# APIRoute sets and bare starlette Routes do not.
fastapi = ">=0.136.3,<0.142.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
cache-dir = "~/.cache/ruff"
line-length = 120
include = [
    "pyproject.toml",
    "gfmodules/**/*.py",
    "tests/**/*.py",
    "examples/**/*.py",
]

[tool.mypy]
files = "gfmodules,tests,examples"
python_version = "3.11"
strict = true
cache_dir = "~/.cache/mypy"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ".:examples"

[tool.pytest.ini_options]
cache_dir = "~/.cache/pytest"
testpaths = [
    "tests",
    "examples",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["gfmodules"]

[tool.coverage.report]
fail_under = 95
